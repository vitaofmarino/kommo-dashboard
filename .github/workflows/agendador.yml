name: Sincronização Diária Kommo -> Supabase

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  executar-scripts:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar App (Leads)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        KOMMO_ACCESS_TOKEN: ${{ secrets.KOMMO_ACCESS_TOKEN }}
        KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
      run: python app.py

    - name: Executar Mapear Auxiliares (Usuários/Etapas/Contatos)
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        KOMMO_ACCESS_TOKEN: ${{ secrets.KOMMO_ACCESS_TOKEN }}
        KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
      run: python mapear_auxiliares.py
